[project]
name = "episteme"
version = "0.1.0"
description = "Episteme — the verifiable artifact runtime for agents (OKX.AI ASP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "cryptography>=42",
  "openai>=1.40",
  "pypdf>=4",
  "polars>=1.0",
  "python-multipart>=0.0.9",
  # email.validate resolves MX records. Without a real resolver the node can only check the regex,
  # and a syntax-only "deliverable" verdict is worth nothing to a buyer — every typo'd domain passes.
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["episteme*"]
